services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reservation_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - reservation_network

  webserver:
    image: nginx:stable-alpine
    container_name: reservation_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reservation_network

  db:
    image: mysql:8.0
    container_name: reservation_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - reservation_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: reservation_phpmyadmin
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "${PMA_PORT}:80"

    depends_on:
      - db
    networks:
      - reservation_network
      
networks:
  reservation_network:
    driver: bridge

volumes:
  db_data: